server:
  port: ${SERVER_PORT}

spring:
  jpa:
    database: ${DATABASE_TYPE}
    database-platform: ${DATABASE_DIALECT}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${CURRENT_SCHEMA}
      dialect: ${spring.jpa.database-platform}
  datasource:
    url: ${MASTER_DB_URL}
    username: ${MASTER_DB_USER:${MASTER_R2DBC_USER}}
    password: ${MASTER_DB_PASSWORD:${MASTER_R2DBC_PASSWORD}}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URI}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD:~}

logging:
  config: classpath:log/logback-k8s.xml

loki:
  project: abbl
  distributor:
    url: ${LOKI_DISTRIBUTOR_URL}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLE:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLE:true}