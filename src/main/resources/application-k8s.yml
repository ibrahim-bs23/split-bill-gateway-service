server:
  port: ${SERVER_PORT}

spring:
  jpa:
    database: ${DATABASE_TYPE}
    database-platform: ${DATABASE_DIALECT}
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${CURRENT_SCHEMA}
      dialect: ${DATABASE_DIALECT}
  datasource:
    url: ${MASTER_DB_URL}
    username: ${MASTER_DB_USER}
    password: ${MASTER_DB_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URI}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}


logging:
  config: classpath:log/logback-k8s.xml
